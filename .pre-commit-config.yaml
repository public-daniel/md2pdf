repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-shebang-scripts-are-executable
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: local
    hooks:
      # The full gate — the same thing CI would run (this repo has no
      # workflows yet). mise is the canonical interface; verbs live in tasks/.
      - id: mise-ci
        name: mise ci
        entry: mise ci
        language: system
        pass_filenames: false
